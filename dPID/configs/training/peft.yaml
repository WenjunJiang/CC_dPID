# configs/training/peft.yaml
# @package _global_
mode: "peft"
search_space:
  classifier_dropout:           {type: uniform,     low: 0.0,   high: 0.5}
  learning_rate:                {type: loguniform,  low: 1e-5,  high: 1e-3}
  weight_decay:                 {type: uniform,     low: 0.0,   high: 0.1}
  per_device_train_batch_size:  {type: choice,      values: [8, 16, 32]}
  num_train_epochs:             {type: randint,     low: 1,     high: 6}
  gradient_accumulation_steps:  {type: choice,      values: [1, 2, 4]}
  warmup_ratio:                 {type: uniform,     low: 0.0,   high: 0.2}

  # LoRA
  lora_r:                       {type: choice, values: [4, 8, 16, 32, 64]}
  lora_alpha:                   {type: choice, values: [8, 16, 32, 64]}
  lora_dropout:                 {type: choice, values: [0.0, 0.1, 0.2, 0.3]}