# Token-only maximum-subarray scoring. This is a new training run, not a resume
# of the old sentence classifier. All masks use the inserted payload boundary.
base_config: peft_benign_exposure_mmbert2_template.yaml

ray:
  output_dir: benign_exposure_peft_mmbert2_email_segment_coverage_seed${data.seed}
hpo:
  skip: false
  num_samples: 20
  max_epochs: 8
  # The token head starts from scratch, so an epoch-2 ranking is not yet a
  # prediction of the epoch-8 ranking; trials whose region term dominates early
  # look worse before they look better.
  grace_period: 3
  # val_f1 at the validation prevalence separated the previous run's top three
  # trials by 0.0007, which is noise, and it cannot see segment width at all.
  metric: val_selection_pr_auc
  checkpoint_path: ${ray.output_dir}/checkpoints/hpo_complete.json
training:
  mode: peft
  segment_scoring: true
  # The loader replaces, rather than merges, the inherited legacy search space.
  search_space:
    segment_tau: {type: choice, values: [0.0, 0.5, 1.0, 2.0, 4.0]}
    region_loss_weight: {type: choice, values: [0.1, 0.2, 0.5, 1.0]}
    # Fraction of the payload that must read as evidence. Replaces the constant
    # malicious_top_k, which a two-token window satisfied as well as a full one.
    positive_coverage: {type: choice, values: [0.25, 0.5, 0.75]}
    # Still a constant: the negative region is hard-negative mining, where the
    # highest few tokens are exactly the ones that matter.
    benign_top_k: {type: choice, values: [3, 8, 16, 32]}
    # One-sided window supervision; 0.0 keeps it off so its cost is measurable.
    leak_loss_weight: {type: choice, values: [0.0, 0.1, 0.5]}
    # Was pinned at 1.0, where the positive term decays as exp(-2 * margin) and
    # its gradient at the decision boundary is 0.01% of its gradient at margin 1.
    gamma_pos: {type: choice, values: [0.0, 0.5, 1.0]}
    learning_rate: {type: loguniform, low: 1e-5, high: 3e-4}
    token_head_dropout: {type: choice, values: [0.0, 0.1, 0.2]}
    effective_batch_size: {type: choice, values: [16, 32, 64]}
    num_train_epochs: {type: choice, values: [3, 5, 8]}
    lora_r: {type: choice, values: [16]}
    lora_alpha: {type: choice, values: [64]}
    lora_dropout: {type: choice, values: [0.0]}
    gamma_neg: {type: choice, values: [2.0]}
    asl_clip: {type: choice, values: [0.01]}
    weight_decay: {type: choice, values: [0.01]}
    warmup_ratio: {type: choice, values: [0.1]}
    benign_to_malicious_ratio: {type: choice, values: [30]}
    # Positives per micro-batch. 0 leaves the sampler off; with it set, the
    # model also needs stratified_prior_ratio, which the training loop derives
    # from benign_to_malicious_ratio. Four out of 32 puts the positive weight at
    # 0.258 and the empty-batch rate at zero; larger values mostly shorten the
    # epoch, since an epoch is one pass over the negative pool.
    malicious_per_batch: {type: choice, values: [4]}
peft:
  extra_modules_to_save: [token_evidence_head]
  save_merged: false
perf:
  # Unchanged on purpose: the empty-positive micro-batch is fixed by stratified
  # sampling, which costs no memory, not by a larger batch.
  max_micro_batch_size: 32
  eval_batch_size: 64
email:
  enabled: true
  region_supervision: true
  # Case of each payload's first letter is redrawn at insertion, with the same
  # probability for both labels, so it cannot act as a label shortcut. Remove
  # the key to insert payloads verbatim.
  first_letter_upper_probability: 0.5
  dataset_name: LLM-PBE/enron-email
  revision: main
  source_split: train
  text_key: text
  cache_dir: email_data_cache
  artifacts_dir: ${ray.output_dir}/email_augmentation
  split_ratios: {train: 0.70, valid: 0.10, calib: 0.10, test: 0.10}
  weights:
    # Was [1/3, 1/3, 1/6, 1/6, 0, 0]: the two email+payload forms held a third of
    # the malicious budget, so at 30:1 a long-context injection was 1.1% of the
    # data and 71% of micro-batches contained none. Long context is the task.
    malicious: [0.20, 0.20, 0.30, 0.30, 0.0, 0.0]
    benign: [0.20, 0.20, 0.25, 0.25, 0.05, 0.05]
template:
  enabled: true
  max_length: ${data.max_seq_length}
